<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日めくり受験数学</title>
<meta name="theme-color" content="#1d3a8a">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--navy:#1d3a8a;--navy2:#2b50b0;--red:#d33a2c;--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mut:#6b7690;--ok:#1e9e62;--ng:#d33a2c;--line:#dde3f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .t{font-size:19px;font-weight:800;letter-spacing:.02em}
header .s{font-size:12px;opacity:.85;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,70,.05)}
.count{display:flex;align-items:center;gap:12px}
.count .num{font-size:40px;font-weight:900;color:var(--red);line-height:1}
.count .lab{font-size:13px;color:var(--mut)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin:8px 0}
.btn.sub{background:#e8edf9;color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
h2{font-size:16px;margin:2px 0 10px}
h3{font-size:14px;margin:14px 0 6px;color:var(--navy)}
.unit{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.unit:last-child{border-bottom:none}
.unit .nm{flex:0 0 42%;font-size:14.5px;font-weight:600}
.unit .gr{font-size:10px;color:#fff;background:#8fa1c9;border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.bar{flex:1;height:10px;background:#edf0f7;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar>i.mid{background:#e8a13a}.bar>i.low{background:var(--ng)}
.unit .pc{flex:0 0 74px;text-align:right;font-size:12.5px;color:var(--mut)}
.q{font-size:18px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q .fig{font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#e8edf9;color:var(--navy);margin-right:6px}
.tag.lv{background:#fdeceb;color:var(--red)}
.tag.rv{background:#fff3d6;color:#9a6a00}
input.ans{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;margin:5px 0}
.fld{display:flex;align-items:center;gap:8px;margin:4px 0}
.fld label{flex:0 0 64px;font-size:14px;font-weight:600}
.fld input{flex:1}
.hintbox{background:#fffbe8;border:1px solid #f0e0a0;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.7;margin:8px 0;display:none}
.explbox{background:#eef7f1;border:1px solid #bfe3cd;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.8;margin:8px 0;display:none;white-space:pre-wrap}
.ansbox{background:#fdeceb;border:1px solid #f3c2bd;border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0;display:none}
.fb{font-size:17px;font-weight:800;margin:10px 0}
.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.small{font-size:12.5px;color:var(--mut);line-height:1.7}
select,input[type=date]{padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;width:100%;margin:5px 0;background:#fff}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;padding:9px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.timer{font-size:22px;font-weight:900;color:var(--red);text-align:center}
.prog{height:8px;background:#edf0f7;border-radius:4px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--navy2)}
.mk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mk .due{font-size:12px;font-weight:700;color:var(--ng)}
.mk .due.wait{color:var(--mut)}
.nav{display:flex;gap:6px;margin-bottom:12px}
.nav button{flex:1;padding:9px 2px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer}
.nav button.on{background:var(--navy);color:#fff}
.hidden{display:none}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist td,table.hist th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
/* ---- math typesetting ---- */
.mv{font-family:"Times New Roman","Hiragino Mincho ProN",serif;font-style:italic}
sup{font-size:.68em;line-height:0}
.frac{display:inline-block;vertical-align:-0.45em;text-align:center;margin:0 .12em}
.frac .fn{display:block;padding:0 .28em;line-height:1.25;font-size:.92em}
.frac .fd{display:block;padding:0 .28em;line-height:1.25;font-size:.92em;border-top:.07em solid currentColor}
.rad{white-space:nowrap}
.rad-root{display:inline-block}
.rad-tall .rad-root{transform:scaleY(1.78);transform-origin:50% 88%}
.rb{display:inline-block;line-height:1;background-image:linear-gradient(currentColor,currentColor);background-size:100% .065em;background-repeat:no-repeat;background-position:0 .145em;margin-left:-.26em;padding:0 .05em 0 .26em}
.rad-tall .rb{padding-top:.24em;background-position:0 .17em}
.figwrap{background:#fbfcff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;text-align:center}
.figwrap svg{max-width:100%;height:auto}
.syswrap{display:flex;align-items:center;gap:6px;margin:10px 0}
.sysbrace{font-family:"Times New Roman",serif;font-size:56px;line-height:1;transform:scaleY(1.55);font-weight:300;color:var(--ink)}
.syslines{font-size:18px;line-height:1.9}
</style>
</head>

<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));       // random int
const NZ=(a,b)=>{let v=0;while(v===0)v=RI(a,b);return v;};  // nonzero int
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
function fracStr(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); n/=g; d/=g; return d===1?String(n):n+"/"+d; }
function parseNum(s){ if(s==null) return NaN; s=String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/－/g,"-").replace(/．/g,".").replace(/\s+/g,"");
  if(s==="") return NaN;
  if(/^[-+]?\d+\/\d+$/.test(s)){ const [a,b]=s.split("/").map(Number); return b===0?NaN:a/b; }
  const v=Number(s); return isNaN(v)?NaN:v; }
function eqNum(a,b){ return isFinite(a)&&isFinite(b)&&Math.abs(a-b)<1e-6; }
const todayStr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function addDays(ds,n){ const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
const SUP={"2":"²","3":"³"};
function sup(n){ return String(n).split("").map(c=>SUP[c]||c).join(""); }
/* ============ rich text (math typesetting) ============ */
/* markup: \f{num}{den} stacked fraction, \r{...} radical, ^{...} superscript.
   Also auto-converts literal ²/³ and √<digits/letter>. Latin letter runs (except "cm") become serif italic. */
function ital(s){ return s.replace(/[A-Za-z]+/g, m => m==="cm" ? m : `<i class="mv">${m}</i>`); }
function radSpan(body){
  const tall = body.includes('<sup') || body.includes('class="frac"') || body.includes('rad-tall');
  return `<span class="rad${tall ? " rad-tall" : ""}"><span class="rad-root">√</span><span class="rb">${body}</span></span>`;
}
function plainRich(s){
  let t = esc(s);
  t = ital(t);
  t = t.replace(/√<i class="mv">([A-Za-z])<\/i>/g, (m, c) => radSpan(`<i class="mv">${c}</i>`));
  t = t.replace(/√([0-9]+)/g, (m, d) => radSpan(d));
  t = t.replace(/²/g, "<sup>2</sup>").replace(/³/g, "<sup>3</sup>");
  return t;
}
function rich(text){
  const parts = String(text).split(/(\\f\{[^{}]*\}\{[^{}]*\}|\\q\{[^{}]*\}\{[^{}]*\}|\\r\{[^{}]*\}|\^\{[^{}]*\})/g);
  return parts.map(seg => {
    let m;
    if(m = seg.match(/^\\f\{([^{}]*)\}\{([^{}]*)\}$/))
      return `<span class="frac"><span class="fn">${plainRich(m[1])}</span><span class="fd">${plainRich(m[2])}</span></span>`;
    if(m = seg.match(/^\\q\{([^{}]*)\}\{([^{}]*)\}$/))
      return `<span class="frac"><span class="fn">${plainRich(m[1])}</span><span class="fd">${radSpan(plainRich(m[2]))}</span></span>`;
    if(m = seg.match(/^\\r\{([^{}]*)\}$/))
      return radSpan(plainRich(m[1]));
    if(m = seg.match(/^\^\{([^{}]*)\}$/))
      return `<sup>${ital(esc(m[1]))}</sup>`;
    return plainRich(seg);
  }).join("");
}
/* ============ SVG figure helpers ============ */
function svgWrap(w, h, inner){ return `<svg viewBox="0 0 ${w} ${h}" width="${Math.min(w,440)}" role="img" aria-label="図">${inner}</svg>`; }
function svgText(x, y, str, opt){ const o=opt||{}; return `<text x="${x}" y="${y}" font-size="${o.size||14}" fill="${o.color||"#1c2333"}" text-anchor="${o.anchor||"middle"}" font-family="${o.serif?"'Times New Roman',serif":"inherit"}" ${o.italic?'font-style="italic"':""} font-weight="${o.bold?700:400}">${str}</text>`; }
/* graph paper: returns {svg parts, X(x), Y(y)} for range [xmin,xmax]x[ymin,ymax] */
function graphSVG(xmin, xmax, ymin, ymax, draw, opt){
  const W=340, H=300, L=34, R=12, T=12, B=30;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R), Y=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);
  let g="";
  for(let gx=Math.ceil(xmin); gx<=xmax; gx++) g+=`<line x1="${X(gx)}" y1="${Y(ymin)}" x2="${X(gx)}" y2="${Y(ymax)}" stroke="#e6ebf5" stroke-width="1"/>`;
  for(let gy=Math.ceil(ymin); gy<=ymax; gy++) g+=`<line x1="${X(xmin)}" y1="${Y(gy)}" x2="${X(xmax)}" y2="${Y(gy)}" stroke="#e6ebf5" stroke-width="1"/>`;
  g=`<line x1="${X(xmin)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(0)}" stroke="#5a6a8c" stroke-width="1.6"/>`
   +`<line x1="${X(0)}" y1="${Y(ymin)}" x2="${X(0)}" y2="${Y(ymax)}" stroke="#5a6a8c" stroke-width="1.6"/>`
   +`<path d="M ${X(xmax)} ${Y(0)} l -7 -3.5 v 7 z" fill="#5a6a8c"/><path d="M ${X(0)} ${Y(ymax)} l -3.5 7 h 7 z" fill="#5a6a8c"/>` + g;
  g+=svgText(X(xmax)-4, Y(0)-6, "x", {serif:1, italic:1, size:14}) + svgText(X(0)+10, Y(ymax)+4, "y", {serif:1, italic:1, size:14}) + svgText(X(0)-8, Y(0)+14, "O", {serif:1, italic:1, size:12});
  const step=(opt&&opt.step)||1;
  for(let gx=Math.ceil(xmin/step)*step; gx<=xmax; gx+=step){ if(gx===0)continue; g+=svgText(X(gx), Y(0)+16, String(gx), {size:10, color:"#6b7690"}); }
  for(let gy=Math.ceil(ymin/step)*step; gy<=ymax; gy+=step){ if(gy===0)continue; g+=svgText(X(0)-8, Y(gy)+3, String(gy), {size:10, color:"#6b7690", anchor:"end"}); }
  g+=draw(X, Y);
  return svgWrap(W, H, g); }
/* plain triangle figure: pts [[x,y,label,labelDx,labelDy]...] in a 320x240 box, edges with optional mid labels, optional right-angle at vertex idx */
function triSVG(pts, edgeLabels, opt){
  const o=opt||{};
  const P=pts.map(p=>[p[0],p[1]]);
  let g=`<polygon points="${P.map(p=>p.join(",")).join(" ")}" fill="${o.fill||"#eef3ff"}" stroke="#1d3a8a" stroke-width="2"/>`;
  if(o.extra) g+=o.extra(P);
  (edgeLabels||[]).forEach((e,i)=>{ if(e==null)return; const a=P[i], b=P[(i+1)%P.length];
    g+=svgText((a[0]+b[0])/2+(e.dx||0), (a[1]+b[1])/2+(e.dy||0), e.t, {size:13, bold:1}); });
  if(o.rightAngle!=null){ const v=P[o.rightAngle], a=P[(o.rightAngle+1)%P.length], b=P[(o.rightAngle+2)%P.length];
    const u1=[(a[0]-v[0]),(a[1]-v[1])], u2=[(b[0]-v[0]),(b[1]-v[1])];
    const l1=Math.hypot(u1[0],u1[1]), l2=Math.hypot(u2[0],u2[1]); const s=14;
    const p1=[v[0]+u1[0]/l1*s, v[1]+u1[1]/l1*s], p2=[p1[0]+u2[0]/l2*s, p1[1]+u2[1]/l2*s], p3=[v[0]+u2[0]/l2*s, v[1]+u2[1]/l2*s];
    g+=`<path d="M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]}" fill="none" stroke="#1d3a8a" stroke-width="1.4"/>`; }
  pts.forEach(p=>{ g+=svgText(p[0]+(p[3]||0), p[1]+(p[4]||0), p[2], {serif:1, italic:1, size:15, bold:1}); });
  return svgWrap(320, 240, g); }
/* ============ state ============ */
const LSKEY="juken_math_v1";
let S;
function freshState(){ return { examDate:"", stats:{}, mistakes:[], daily:null, hist:[], totalDays:0 }; }
function load(){ try{ S=JSON.parse(localStorage.getItem(LSKEY))||freshState(); }catch(e){ S=freshState(); }
  if(!S.stats)S.stats={}; if(!S.mistakes)S.mistakes=[]; if(!S.hist)S.hist=[]; }
function save(){ try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(e){ /* 保存できない環境（プレビュー等）でも動作は続ける */ } }
function stat(u){ if(!S.stats[u])S.stats[u]={n:0,c:0}; return S.stats[u]; }
function acc(u){ const s=S.stats[u]; if(!s||!s.n) return null; return s.c/s.n; }
/* ============ units ============ */
const UNITS=[
 {id:"signed", g:1, name:"正負の数"},
 {id:"moji", g:1, name:"文字式"},
 {id:"lin_eq", g:1, name:"一次方程式"},
 {id:"prop", g:1, name:"比例・反比例"},
 {id:"poly", g:2, name:"式の計算"},
 {id:"simul", g:2, name:"連立方程式"},
 {id:"lin_fn", g:2, name:"一次関数"},
 {id:"prob", g:2, name:"確率"},
 {id:"expand", g:3, name:"展開・因数分解"},
 {id:"sqrt", g:3, name:"平方根"},
 {id:"quad_eq", g:3, name:"二次方程式"},
 {id:"quad_fn", g:3, name:"関数 y=ax²"},
 {id:"similar", g:3, name:"相似"},
 {id:"pyth", g:3, name:"三平方の定理"},
 {id:"circle", g:3, name:"円"},
 {id:"data", g:3, name:"データの活用"},
];
const UMAP={}; UNITS.forEach(u=>UMAP[u.id]=u);
/* circle figure for central/inscribed angle problems: central label & inscribed label as args */
function circleFigInscribed(centralLabel, inscribedLabel){
  const O=[160,125], r=88, pt=dg=>[O[0]+r*Math.cos(dg*Math.PI/180), O[1]+r*Math.sin(dg*Math.PI/180)];
  const p1=pt(150), p2=pt(30), P=pt(270);
  return svgWrap(320,250,`
    <circle cx="${O[0]}" cy="${O[1]}" r="${r}" fill="#eef3ff" stroke="#1d3a8a" stroke-width="2"/>
    <line x1="${O[0]}" y1="${O[1]}" x2="${p1[0]}" y2="${p1[1]}" stroke="#1d3a8a" stroke-width="2"/>
    <line x1="${O[0]}" y1="${O[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#1d3a8a" stroke-width="2"/>
    <line x1="${P[0]}" y1="${P[1]}" x2="${p1[0]}" y2="${p1[1]}" stroke="#d33a2c" stroke-width="2"/>
    <line x1="${P[0]}" y1="${P[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#d33a2c" stroke-width="2"/>
    <circle cx="${O[0]}" cy="${O[1]}" r="3.5" fill="#1c2333"/>
    ${svgText(O[0]-13, O[1]+5, "O", {serif:1, italic:1, size:13, bold:1})}
    ${svgText(O[0], O[1]+42, centralLabel, {size:14, bold:1})}
    ${svgText(P[0], P[1]-10, inscribedLabel, {size:14, bold:1, color:"#d33a2c"})}`);
}
/* ============ problem generators (all original; answers computed from parameters) ============ */
function F(k,label,ans){ return {k,label,ans}; }
function P(unit,level,q,fields,hints,expl,opt){ const o={unit,level,q,fields,hints,expl}; if(opt){ if(opt.pair)o.pair=1; if(opt.fig)o.fig=opt.fig; if(opt.sys)o.sysLines=opt.sys; } return o; }
const GEN={
signed(L){
  if(L===1){ const a=NZ(-20,20), b=NZ(-20,20); const minus=Math.random()<0.5;
    const v=minus?a-b:a+b;
    return P("signed",1,`次の計算をせよ。\n${a} ${minus?"−":"+"} ${b<0?"("+b+")":b}`,[F("v","答え",v)],
      ["符号に注意して、たし算・ひき算のルールを使おう。","負の数をひくと、符号が変わるよ。"],
      `${a} ${minus?"−":"+"} ${b<0?"("+b+")":b} = ${v}`); }
  if(L===2){ const mul=Math.random()<0.5;
    if(mul){ const a=NZ(-12,12), b=NZ(-12,12); return P("signed",2,`次の計算をせよ。\n(${a}) × (${b})`,[F("v","答え",a*b)],
      ["符号の決め方：負×負は正、負×正は負。","まず符号を決めてから、数の計算をしよう。"],
      `(${a}) × (${b}) = ${a*b}`); }
    const b=NZ(-12,12); const q0=NZ(-12,12); const a=b*q0;
    return P("signed",2,`次の計算をせよ。\n(${a}) ÷ (${b})`,[F("v","答え",q0)],
      ["わり算も、符号のルールはかけ算と同じ。","何に何をかけると "+a+" になるか考えよう。"],
      `(${a}) ÷ (${b}) = ${q0}`); }
  if(L===3){ const a=RI(2,6); const cube=Math.random()<0.5; const v=cube?-(a*a*a):a*a; const e=cube?3:2;
    const base=cube?-a:-a;
    return P("signed",3,`次の計算をせよ。\n(${base})^{${e}}`,[F("v","答え",v)],
      ["累乗は、同じ数をくり返しかけること。","指数が偶数なら結果は正、奇数なら負のまま。"],
      `(${base})^{${e}} = ${v}`); }
  const b=NZ(-9,9), c=NZ(-9,9), d=NZ(-9,9); const a=RI(-15,15); const v=a+b*c-d;
  return P("signed",4,`次の計算をせよ。\n${a} + (${b}) × (${c}) − (${d})`,[F("v","答え",v)],
    ["計算の順序：かけ算・わり算を先に、たし算・ひき算は後。","まず ("+b+") × ("+c+") = "+(b*c)+" を計算しよう。"],

      ["個数の式と、代金の式を1つずつ立てる。","りんごを x 個、みかんを y 個とすると、x + y = "+tot+"。"],
      `x + y = ${tot}\n${a}x + ${b}y = ${money}\n解くと x = ${cx}, y = ${cy}`); }

expand(L){

      [F("c1","x の係数",a+b), F("c2","定数項",a*b)],

      `x の係数: ${a} + ${b} = ${a+b}\n定数項: ${a} × ${b} = ${a*b}`); }

      `たして ${p}、かけて ${q} になるのは ${a} と ${b}\n(x ${a<0?"− "+Math.abs(a):"+ "+a})(x ${b<0?"− "+Math.abs(b):"+ "+b})`,{pair:true}); }
  if(L===3){ const a=NZ(-9,9);

      [F("c1","x の係数",2*a), F("c2","定数項",a*a)],

    [F("c1","x² の係数",a*c), F("c2","x の係数",a*d+b*c), F("c3","定数項",b*d)],
    ["各項をすべてかけ合わせる（分配法則を2回）。","x の項は (外×外) と (内×内) の2つが出る。"],
    `x²: ${a} × ${c} = ${a*c}\nx: ${a} × ${d} + ${b} × ${c} = ${a*d+b*c}\n定数: ${b} × ${d} = ${b*d}`);
},
sqrt(L){

      `\\q{${c0}}{${b}} = \\f{${c0}√${b}}{${b}} = \\f{${c0/g}√${b}}{${b/g}}`); }

quad_eq(L){

    return P("quad_eq",1,`次の二次方程式を解け。\nx² ${p<0?"− "+Math.abs(p):"+ "+p}x ${q<0?"− "+Math.abs(q):"+ "+q} = 0`,
      [F("c1","解 1",r1), F("c2","解 2",r2)],["因数分解できれば、各因数 = 0 として解ける。","たして "+(-p)+"、かけて "+q+" になる2数を探そう。"],
      `(x ${r1<0?"+ "+Math.abs(r1):"− "+r1})(x ${r2<0?"+ "+Math.abs(r2):"− "+r2}) = 0\nx = ${r1}, ${r2}`,{pair:true}); }

    return P("quad_eq",2,`次の二次方程式を解け。\n(x ${a<0?"− "+Math.abs(a):"+ "+a})² = ${b*b}`,

      `x ${a<0?"− "+Math.abs(a):"+ "+a} = ${b} のとき x = ${r1}\nx ${a<0?"− "+Math.abs(a):"+ "+a} = −${b} のとき x = ${r2}`,{pair:true}); }
  if(L===3){ const a0=pick([2,3]); const r1=pick([-4,-3,-2,-1,1,2,3]); let r2=pick([-3,-2,-1,1,2,3,4]); if(r2===r1)r2+=1;
    const B=-a0*(r1+r2), C=a0*r1*r2;

      [F("c1","解 1",r1), F("c2","解 2",r2)],["解の公式か、たすき掛けの因数分解で解ける。",`因数分解すると ${a0}(x ${r1<0?"+ "+Math.abs(r1):"− "+r1})(x ${r2<0?"+ "+Math.abs(r2):"− "+r2}) = 0 になる。`],
      `${a0}(x ${r1<0?"+ "+Math.abs(r1):"− "+r1})(x ${r2<0?"+ "+Math.abs(r2):"− "+r2}) = 0\nx = ${r1}, ${r2}`,{pair:true}); }

    ["面積 = 縦 × 横 の式を立てる：x(x + "+a+") = "+A+"。","展開して因数分解すると、(x − □)(x + △) = 0 の形になる。長さは正の数だけが答え。"],
    `x(x + ${a}) = ${A}\nx² + ${a}x − ${A} = 0\n(x − ${x0})(x + ${x0+a}) = 0\nx = ${x0}（長さなので正の解）`);

/* ============ app logic ============ */
function fmtVal(v){ if(Number.isInteger(v)) return String(v);
  const fr=[2,3,4,6,8,9,12,36].find(d=>Math.abs(v-Math.round(v*d)/d)<1e-9);
  if(fr) return fracStr(Math.round(v*fr),fr);
  return String(Math.round(v*1000)/1000); }
function ansText(p){ return p.fields.map(f=>f.label+" = "+fmtVal(f.ans)).join("、"); }
let view="home";
let session=null;
function daysLeft(){ if(!S.examDate) return null; return daysBetween(todayStr(), S.examDate); }
function dueReviews(){ const t=todayStr(); const out=[];
  S.mistakes.forEach(m=>{ if(m.d2&&t>=m.d2)out.push({m,stage:2}); else if(m.d7&&t>=m.d7)out.push({m,stage:7}); });
  return out; }
function pickLevel(unitId, days){
  const a=acc(unitId); let base;
  if(a===null) base=1; else if(a<0.5) base=1; else if(a<0.7) base=2; else if(a<0.85) base=3; else base=4;
  if(days!==null&&days<=14) base=Math.min(4,base+1);
  return base; }
function composeDaily(){
  const t=todayStr(); if(S.daily&&S.daily.date===t) return S.daily;
  const items=[]; const days=daysLeft();
  const due=dueReviews().slice(0,2);
  due.forEach(d=>items.push({reviewId:d.m.id, unit:d.m.unit, level:d.m.level, stage:d.stage}));
  const scored=UNITS.map(u=>{ const a=acc(u.id); return {u, score: a===null?0.35:a}; })
    .filter(x=>!items.some(i=>i.unit===x.u.id))
    .sort((x,y)=>x.score-y.score);
  const target=RI(4,5);
  for(const s of scored){ if(items.length>=target)break;
    items.push({unit:s.u.id, level:pickLevel(s.u.id, days)}); }
  S.daily={date:t, items, done:0}; save(); return S.daily; }
function startSession(title, specs, opt){
  const queue=specs.map(sp=>{ const prob=GEN[sp.unit](sp.level);
    return {prob, reviewId:sp.reviewId||null, reviewStage:sp.stage||null}; });
  session={title, queue, idx:0, correct:0, results:[], dailyMode:!!(opt&&opt.daily), timed:!!(opt&&opt.timed), deadline: opt&&opt.timed?Date.now()+opt.timed*1000:null, timerId:null};
  view="session"; renderSession(); }
function finishSession(){
  if(session.timerId)clearInterval(session.timerId);
  const t=todayStr();
  const tot=session.results.length, cor=session.results.filter(r=>r.ok).length;
  if(tot){ const h=S.hist.find(x=>x.date===t); if(h){h.n+=tot;h.c+=cor;} else S.hist.push({date:t,n:tot,c:cor}); }
  if(session.dailyMode){ const d=S.daily; if(d&&d.date===t) d.done=d.items.length; }
  const html=`<div class="card"><h2>${esc(session.title)}：結果</h2>
    <p class="fb ${tot&&cor*2>=tot?"ok":"ng"}">${tot}問中 ${cor}問 正解</p>
    ${session.results.map((r,i)=>`<p class="small">${i+1}. 【${UMAP[r.prob.unit].name}】Lv${r.prob.level} ${r.ok?"⭕ 正解":r.seenAns?"👀 答えを見た":"❌ 不正解"}</p>`).join("")}
    <button class="btn" onclick="goHome()">ホームへ</button></div>`;
  session=null; save(); $("#app").innerHTML=html; window.scrollTo(0,0); }
function goHome(){ if(session&&session.timerId)clearInterval(session.timerId); session=null; view="home"; renderHome(); }
function addMistake(p){
  const ex=S.mistakes.find(x=>x.unit===p.unit&&x.level===p.level);
  if(!ex) S.mistakes.push({id:"m"+Date.now()+Math.floor(Math.random()*9999), unit:p.unit, level:p.level,
    d2:addDays(todayStr(),2), d7:addDays(todayStr(),7), first:todayStr()}); }
function recordResult(item, okRaw, seenAns){
  const p=item.prob; const ok=okRaw&&!seenAns; const st=stat(p.unit); st.n++; if(ok)st.c++;
  if(item.reviewId){
    const m=S.mistakes.find(x=>x.id===item.reviewId);
    if(m){ if(item.reviewStage===2){ m.d2 = ok? null : addDays(todayStr(),2); }
      if(item.reviewStage===7){ m.d7 = ok? null : addDays(todayStr(),2); }
      if(!m.d2&&!m.d7) S.mistakes=S.mistakes.filter(x=>x.id!==m.id); }
  } else if(!ok){ addMistake(p); }
  session.results.push({prob:p, ok, seenAns});
  if(ok)session.correct++;
  save(); }
function renderSession(){
  const item=session.queue[session.idx]; const p=item.prob;
  const total=session.queue.length;
  $("#app").innerHTML=`
   <div class="nav"><button onclick="quitSession()">やめる</button></div>
   <div class="card">
    ${session.timed?'<div class="timer" id="tmr"></div>':""}
    <div class="small">${esc(session.title)} ｜ ${session.idx+1} / ${total} 問目</div>
    <div class="prog"><i style="width:${session.idx/total*100}%"></i></div>
    <p><span class="tag">${UMAP[p.unit].name}</span><span class="tag lv">Lv${p.level}</span>${item.reviewId?'<span class="tag rv">間違い帳の復習</span>':""}</p>
    <div class="q">${rich(p.q)}</div>
    ${p.sysLines?`<div class="syswrap"><div class="sysbrace">{</div><div class="syslines">${p.sysLines.map(l=>`<div>${rich(l)}</div>`).join("")}</div></div>`:""}
    ${p.fig?`<div class="figwrap">${p.fig}</div>`:""}
    <div id="fields">${p.fields.map((f,i)=>`<div class="fld"><label>${rich(f.label)}</label><input class="ans" data-i="${i}" inputmode="text" autocomplete="off" placeholder="答えを入力"></div>`).join("")}</div>
    <p class="small">分数は 3/4 のように入力できます。小数でもOKです。</p>
    <div id="fb"></div>
    <div id="hintArea"></div>
    <div class="row">
      <button class="btn sub" id="btnHint">💡 ヒント1</button>
      <button class="btn" id="btnGrade">答え合わせ</button>
    </div>
    <button class="btn ghost hidden" id="btnNext">次の問題へ</button>
   </div>`;
  let hintStage=0, graded=false, seenAns=false;
  const hintArea=$("#hintArea");
  $("#btnHint").onclick=()=>{
    if(hintStage===0){ hintArea.innerHTML=`<div class="hintbox" style="display:block">💡 ヒント1：${rich(p.hints[0])}</div>`; hintStage=1; $("#btnHint").textContent="💡 ヒント2"; }
    else if(hintStage===1){ hintArea.innerHTML+=`<div class="hintbox" style="display:block">💡 ヒント2：${rich(p.hints[1])}</div>`; hintStage=2; $("#btnHint").textContent="📖 解説を見る"; }
    else if(hintStage===2){ hintArea.innerHTML+=`<div class="explbox" style="display:block">📖 解説\n${rich(p.expl)}</div>`; hintStage=3; $("#btnHint").textContent="答えを見る"; }
    else if(hintStage===3){ hintArea.innerHTML+=`<div class="ansbox" style="display:block">答え：${rich(ansText(p))}</div>`; hintStage=4; $("#btnHint").disabled=true; seenAns=true; }
  };
  $("#btnGrade").onclick=()=>{
    if(graded)return;
    const vals=p.fields.map((f,i)=>parseNum(document.querySelector(`input[data-i="${i}"]`).value));
    if(vals.some(v=>!isFinite(v))){ $("#fb").innerHTML=`<p class="fb ng">答えを入力してから押してね。</p>`; return; }
    graded=true;
    let okRaw;
    if(p.pair&&p.fields.length===2){
      const a=vals[0], b=vals[1], x=p.fields[0].ans, y=p.fields[1].ans;
      okRaw=(eqNum(a,x)&&eqNum(b,y))||(eqNum(a,y)&&eqNum(b,x));
    } else okRaw=p.fields.every((f,i)=>eqNum(vals[i], f.ans));
    recordResult(item, okRaw, seenAns);
    const ok=okRaw&&!seenAns;
    $("#fb").innerHTML= ok?`<p class="fb ok">⭕ 正解！</p>`
      : `<p class="fb ng">${seenAns?"👀 答えを見たので、復習リストに入れたよ。":"❌ 残念…"} 正解は ${rich(ansText(p))}</p>
         <div class="explbox" style="display:block">📖 解説\n${rich(p.expl)}</div>`;
    document.querySelectorAll("input.ans").forEach(i=>i.disabled=true);
    $("#btnGrade").disabled=true; $("#btnHint").disabled=true;
    const nb=$("#btnNext"); nb.classList.remove("hidden");
    nb.textContent= session.idx+1>=total?"結果を見る":"次の問題へ";
    nb.onclick=()=>{ session.idx++; if(session.idx>=session.queue.length) finishSession(); else renderSession(); };
  };
  if(session.timed) startTimer();
  const f0=document.querySelector("input.ans"); if(f0)f0.focus(); }
function startTimer(){
  const tick=()=>{ if(!session)return; const ms=session.deadline-Date.now();
    const el=$("#tmr"); if(!el)return;
    if(ms<=0){ clearInterval(session.timerId);
      while(session.results.length<session.queue.length){ const it=session.queue[session.results.length];
        const st=stat(it.prob.unit); st.n++; if(!it.reviewId) addMistake(it.prob);
        session.results.push({prob:it.prob, ok:false, seenAns:false}); }
      save(); finishSession(); return; }
    const s=Math.ceil(ms/1000); el.textContent="⏱ 残り "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
  tick(); session.timerId=setInterval(tick,500); }
function quitSession(){ if(session&&session.timerId)clearInterval(session.timerId); session=null; renderHome(); }
/* ============ screens ============ */
function renderHome(){
  view="home"; const dl=daysLeft(); const d=composeDaily(); const dueCnt=dueReviews().length;
  const dailyDone=d.done>=d.items.length;
  $("#app").innerHTML=`
   <div class="card count">
     <div>${dl===null?'<div class="lab">入試日を設定すると<br>カウントダウンが始まります</div>':`<div class="num">${dl}</div><div class="lab">入試まで あと ${dl} 日<br>${esc(S.examDate)} が本番です</div>`}</div>
     <div style="flex:1"></div>
     <button class="btn sub" style="width:auto;padding:10px 14px;margin:0" onclick="renderSettings()">⚙ 設定</button>
   </div>
   <div class="card">
     <h2>📅 今日の数問（${d.items.length}問）</h2>
     ${dailyDone?`<p class="fb ok">今日の分は完了しました。おつかれさま！</p>`:`<p class="small">弱点の単元と復習を組み合わせた、今日のセットです。</p>
     <button class="btn" onclick="startDaily()">今日のセットをはじめる</button>`}
     ${dueCnt?`<p class="small">間違い帳から、今日が復習日の問題が ${dueCnt} 件あります（今日のセットに入っています）。</p>`:""}
   </div>
   <div class="card">
     <h2>メニュー</h2>
     <button class="btn sub" onclick="renderDrill()">📚 単元別ドリル</button>
     <button class="btn sub" onclick="startExam()">⏱ 実戦モード（5問・8分）</button>
     <button class="btn sub" onclick="renderMistakes()">📕 間違い帳（${S.mistakes.length}件）</button>
     <button class="btn sub" onclick="renderGraph()">📊 弱点グラフ</button>
   </div>
   ${S.hist.length?`<div class="card"><h2>最近の記録</h2><table class="hist">${S.hist.slice(-7).reverse().map(h=>`<tr><td>${h.date}</td><td>${h.n}問</td><td>正解 ${h.c}問</td></tr>`).join("")}</table></div>`:""}
   <p class="small">問題はすべてオリジナルです。記録はこの端末の中だけに保存されます。</p>`;
  save(); }
function startDaily(){ const d=composeDaily();
  startSession("今日の数問", d.items.map(sp=>({unit:sp.unit, level:sp.level, reviewId:sp.reviewId, stage:sp.stage})), {daily:true}); }
function startExam(){
  const pool=UNITS.filter(u=>u.g===3);
  const specs=[]; const used=new Set();
  while(specs.length<5){ const u=pick(pool); if(used.has(u.id))continue; used.add(u.id); specs.push({unit:u.id, level:RI(2,3)}); }
  startSession("実戦モード", specs, {timed:480}); }
function unitRow(u, clickable){
  const a=acc(u.id); const pct=a===null?0:Math.round(a*100);
  const cls=a===null?"":a>=0.8?"":a>=0.5?"mid":"low";
  return `<div class="unit" ${clickable?`onclick="startDrillUnit('${u.id}')" style="cursor:pointer"`:""}>
    <div class="nm">${u.name}<span class="gr">中${u.g}</span></div>
    <div class="bar">${a===null?"":`<i class="${cls}" style="width:${pct}%"></i>`}</div>
    <div class="pc">${a===null?"未挑戦":pct+"% ("+S.stats[u.id].c+"/"+S.stats[u.id].n+")"}</div></div>`; }
function renderDrill(){
  view="drill";
  $("#app").innerHTML=`<div class="nav"><button onclick="goHome()">← ホーム</button></div>
   <div class="card"><h2>📚 単元別ドリル</h2><p class="small">単元をタップすると、レベル選択に進みます。正答率のバーが短い単元が弱点です。</p>${UNITS.map(u=>unitRow(u,true)).join("")}</div>`; }
let drillUnit=null;
function startDrillUnit(uid){ drillUnit=uid; const u=UMAP[uid];
  $("#app").innerHTML=`<div class="nav"><button onclick="renderDrill()">← 単元一覧</button></div>
   <div class="card"><h2>${u.name}（中${u.g}）</h2>
   <p class="small">レベルを選んでください。5問出ます。</p>
   <div class="seg">${[1,2,3,4].map(l=>`<button onclick="startDrillGo(${l})">Lv${l}</button>`).join("")}</div>
   <p class="small">Lv1 基礎 ・ Lv2 標準 ・ Lv3 実戦 ・ Lv4 入試レベル</p></div>`; }
function startDrillGo(lv){ const specs=Array.from({length:5},()=>({unit:drillUnit, level:lv})); startSession(UMAP[drillUnit].name+" Lv"+lv, specs, {}); }
function renderMistakes(){
  view="mistakes"; const t=todayStr();
  const rows=S.mistakes.length?S.mistakes.map(m=>{ const due=(m.d2&&t>=m.d2)||(m.d7&&t>=m.d7);
    return `<div class="mk"><b>${UMAP[m.unit].name}</b> Lv${m.level} <span class="due ${due?"":"wait"}">${due?"今日が復習日です":"次回 "+(m.d2||m.d7)+" に復習"}</span><br><span class="small">間違えた日：${m.first}／復習予定：2日後 ${m.d2||"済"} ・ 1週間後 ${m.d7||"済"}</span></div>`; }).join("")
    : `<p class="small">間違い帳は空です。間違えた問題はここに記録され、2日後と1週間後に類題が自動で出ます。</p>`;
  $("#app").innerHTML=`<div class="nav"><button onclick="goHome()">← ホーム</button></div>
   <div class="card"><h2>📕 間違い帳</h2>${rows}</div>`; }
function renderGraph(){
  view="graph";
  const weak=UNITS.filter(u=>acc(u.id)!==null).sort((x,y)=>acc(x.id)-acc(y.id)).slice(0,3);
  $("#app").innerHTML=`<div class="nav"><button onclick="goHome()">← ホーム</button></div>
   <div class="card"><h2>📊 弱点グラフ</h2>
   ${weak.length?`<p class="small">いまの弱点：${weak.map(u=>u.name+"（"+Math.round(acc(u.id)*100)+"%）").join("、")}</p>`:`<p class="small">まだ記録がありません。ドリルや今日のセットを解くと、正答率が表示されます。</p>`}
   ${UNITS.map(u=>unitRow(u,false)).join("")}</div>`; }
function renderSettings(){
  view="settings";
  $("#app").innerHTML=`<div class="nav"><button onclick="goHome()">← ホーム</button></div>
   <div class="card"><h2>⚙ 設定</h2>
    <label class="small">入試の日（本番の日付）</label>
    <input type="date" id="examDate" value="${esc(S.examDate||"")}">
    <button class="btn" onclick="saveSettings()">保存する</button>
    <h3>データについて</h3>
    <p class="small">記録はこの端末のブラウザ内（localStorage）にだけ保存されます。サーバーには送信されません。</p>
    <button class="btn ghost" onclick="if(confirm('記録をすべて消します。よろしいですか？')){try{localStorage.removeItem(LSKEY);}catch(e){} load();goHome();}">記録をすべて消す</button>
   </div>`; }
function saveSettings(){ S.examDate=$("#examDate").value||""; S.daily=null; save(); goHome(); }
/* ============ boot ============ */
try{ load(); renderHome(); window.__jukenBooted=true; }
catch(e){ const el=document.getElementById("app");
  if(el) el.innerHTML='<div class="card"><h2>アプリを起動できませんでした</h2><p>この表示環境では、スクリプトや保存機能（localStorage）が制限されている可能性があります。</p><p>Safari や Chrome でファイルを開くか、公開ページのURLから開いてみてください。</p><p class="small">詳細: '+String(e&&e.message||e)+'</p></div>'; }
window.__GEN=GEN; window.__state=()=>S;
</script>
</body>
